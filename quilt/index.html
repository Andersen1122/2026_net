<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Number Quilt</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="quilt">

        <div class="number large">7</div>
        <div class="number small">2</div>
        <div class="number">9</div>
        <div class="number huge">4</div>
        <div class="number faded">8</div>

        <div class="number rotated">1</div>
        <div class="number large">6</div>
        <div class="number small">3</div>
        <div class="number">0</div>
        <div class="number huge">5</div>

        <div class="number faded">2</div>
        <div class="number rotated large">8</div>
        <div class="number">4</div>
        <div class="number small">7</div>
        <div class="number large">1</div>

        <div class="number huge">9</div>
        <div class="number faded">6</div>
        <div class="number rotated">3</div>
        <div class="number large">0</div>
        <div class="number small">5</div>

        <div class="number">8</div>
        <div class="number huge rotated">2</div>
        <div class="number faded">7</div>
        <div class="number large">4</div>
        <div class="number">6</div>

    </div>

</body>

</html>
