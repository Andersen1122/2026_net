<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Secret Forest</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="forest-page">

        <h1>THE SECRET FOREST</h1>

        <p class="intro">
            Some places are not meant to be found.
        </p>

        <img src="forest.jpg" alt="A mysterious forest path" class="main-image">

        <div class="sign" id="hidden-sign">
            <span>KEEP WALKING</span>
        </div>

        <div class="note">
            <p>
                There is something hidden somewhere in this forest.
            </p>
        </div>

        <div class="small-message">
            <span>Did you see this?</span>
        </div>

        <div class="tree-message">
            <p>LOOK BEHIND YOU.</p>
        </div>

        <div class="secret">
            <p>YOU FOUND THE SECRET.</p>
        </div>

        <div class="bottom-text">
            The forest remembers everything.
        </div>

    </div>

</body>
</html>
